name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish (Native AOT, self-contained, single file)
        run: >
          dotnet publish CodeAssistant.TUI/CodeAssistant.TUI.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishAot=true
          -p:PublishSingleFile=true
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: CodeAssistant-win-x64
          path: publish/CodeAssistant.TUI.exe
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/CodeAssistant.TUI.exe
